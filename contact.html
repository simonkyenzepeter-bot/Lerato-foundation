<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Lerato Foundation</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary-blue: #1a73e8;
      --secondary-gold: #ffdd57;
      --text-dark: #333;
      --bg-light: #f0f4f8;
      --radius: 15px;
      --transition: 0.3s ease;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background: var(--bg-light);
      color: var(--text-dark);
    }

    /* Navbar */
    .navbar {
      background: var(--primary-blue);
      padding: 1rem 2rem;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .navbar a {
      color: #fff;
      margin-left: 1rem;
      text-decoration: none;
      transition: color var(--transition);
    }
    .navbar a:hover { color: var(--secondary-gold); }
    .navbar .logo { font-weight: bold; font-size: 1.6rem; }

    /* Hero Section */
    .hero {
      background: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&q=80&w=1080') no-repeat center center/cover;
      padding: 4rem 2rem;
      text-align: center;
      color: #fff;
      border-bottom-left-radius: 30px;
      border-bottom-right-radius: 30px;
    }
    .hero h2 { font-size: 2.5rem; margin-bottom: 0.5rem; text-shadow: 1px 1px 4px rgba(0,0,0,0.5);}
    .hero p { font-size: 1.2rem; text-shadow: 1px 1px 4px rgba(0,0,0,0.5); }

    /* Contact Section */
    .section {
      max-width: 1000px;
      margin: -3rem auto 3rem auto;
      padding: 0 2rem;
    }
    .contact-container {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      justify-content: center;
    }
    .contact-card {
      background: #fff;
      padding: 2rem;
      border-radius: var(--radius);
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      flex: 1 1 400px;
      transition: transform var(--transition), box-shadow var(--transition);
    }
    .contact-card:hover { transform: translateY(-5px); box-shadow: 0 12px 25px rgba(0,0,0,0.15); }

    /* Form */
    .contact-form label { display: block; margin-bottom: 0.5rem; font-weight: 600; }
    .contact-form input, .contact-form textarea {
      width: 100%;
      padding: 0.75rem;
      margin-bottom: 1rem;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 1rem;
      transition: border var(--transition), box-shadow var(--transition);
    }
    .contact-form input:focus, .contact-form textarea:focus {
      border-color: var(--primary-blue);
      box-shadow: 0 0 5px rgba(26,115,232,0.5);
      outline: none;
    }
    .contact-form button {
      background: var(--primary-blue);
      color: #fff;
      border: none;
      padding: 0.75rem 2rem;
      font-size: 1rem;
      border-radius: 10px;
      cursor: pointer;
      transition: background var(--transition), transform var(--transition);
    }
    .contact-form button:hover { background: #155ab6; transform: scale(1.05); }

    /* Contact Info */
    .contact-info h3 { margin-bottom: 1rem; color: var(--primary-blue); }
    .contact-info p { margin-bottom: 1rem; font-size: 1rem; }
    .contact-info p i { margin-right: 0.5rem; color: var(--primary-blue); }
    .contact-info p a { color: var(--primary-blue); text-decoration: none; }
    .status-message { text-align: center; margin-top: 1rem; font-weight: bold; color: green; }

    /* Footer */
    .footer {
      background: var(--primary-blue);
      color: #fff;
      text-align: center;
      padding: 1rem;
      margin-top: 2rem;
      border-top-left-radius: 15px;
      border-top-right-radius: 15px;
    }

    /* Floating WhatsApp Button */
    .whatsapp-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #25d366;
      color: #fff;
      font-size: 1.5rem;
      border-radius: 50%;
      padding: 15px;
      z-index: 1000;
      box-shadow: 0 6px 15px rgba(0,0,0,0.2);
      transition: transform var(--transition);
      text-decoration: none;
    }
    .whatsapp-btn:hover { transform: scale(1.1); }

    /* Responsive */
    @media(max-width:768px){ .contact-container { flex-direction: column; margin-top: 2rem; } }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="index.html" class="logo">Lerato Foundation</a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="blog.html">Blog</a>
      <a href="contact.html" class="active">Contact</a>
    </div>
  </nav>

  <!-- Hero Section -->
  <div class="hero">
    <h2>Contact Lerato Foundation</h2>
    <p>We’re here to answer your questions and collaborate for change</p>
  </div>

  <!-- Contact Section -->
  <section class="section">
    <div class="contact-container">
      <!-- Contact Form -->
      <form id="contactForm" class="contact-card contact-form" action="https://formsubmit.co/leratofoundationkenya@gmail.com" method="POST">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_next" value="https://www.leratofoundation.org/thankyou.html">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="5" required></textarea>
        <button type="submit"><i class="fas fa-paper-plane"></i> Send Message</button>
        <div id="status" class="status-message"></div>
      </form>

      <!-- Contact Info -->
      <div class="contact-card contact-info">
        <h3>Get in Touch</h3>
        <p><i class="fas fa-envelope"></i> <a href="mailto:leratofoundationkenya@gmail.com">leratofoundationkenya@gmail.com</a></p>
        <p><i class="fas fa-phone"></i> <a href="tel:+254797484525">+254 797 484 525</a></p>
        <p><i class="fas fa-map-marker-alt"></i> Nairobi, Kenya</p>
        <!-- Google Map -->
        <div style="margin-top:1rem;border-radius:var(--radius);overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,0.1);">
          <iframe 
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3988.123456789!2d36.8219!3d-1.2921!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x182f10a123456789%3A0xabcdef123456789!2sNairobi%2C%20Kenya!5e0!3m2!1sen!2sus!4v1699999999999!5m2!1sen!2sus" 
            width="100%" height="220" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
          </iframe>
        </div>
      </div>
    </div>
  </section>

  <!-- Floating WhatsApp Button -->
  <a href="https://wa.me/254797484525" class="whatsapp-btn" target="_blank" title="Chat with us on WhatsApp"><i class="fab fa-whatsapp"></i></a>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2025 Lerato Foundation | All Rights Reserved</p>
  </footer>

  <!-- Scripts -->
  <script>
    const form = document.getElementById('contactForm');
    const status = document.getElementById('status');

    form.addEventListener('submit', (e) => {
      status.textContent = 'Sending...';
      setTimeout(() => {
        status.textContent = 'Message sent successfully! Redirecting...';
      }, 500);
    });
  </script>

</body>
</html>
